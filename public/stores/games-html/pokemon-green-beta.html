<html>
  <!-- Ultimate Game Stash file-->
  <!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->
  <!-- List of debug features: 35 additional Pokémon exist. Some Pokémon are different (For example, Blastoise is Totartle). You can hold B to run and walk through walls. Holding B also disables trainers from seeing the player as well as wild encounters. The player has a fully completed Pokédex. The player is named NINTEN and the rival is named SONY. The inventory has a lot of items, including a bicycle, 99 Full Restores, 99 Rare Candies, among others. Also, when selecting the DEBUG option, the player will be prompted to name 6 Pokémon that spawn in the party. -->
  <head>
    <script src="//www.google.com/jsapi"></script>
    <script>
      alert("This is a beta version of Pokémon Green. To access the beta features, press select (V by default) at the title screen and select 'DEBUG'.");
    </script>

    <style>
      body {
        overflow: hidden;
        background: #000000;
        margin-top: 0;
        margin-left: 0;
        color: #000000;
      }

      #startButton {
        display: block;
        width: 160px;
        height: 40px;
        background-color: #4caf50;
        color: white;
        text-align: center;
        text-decoration: none;
        font-size: 16px;
        margin: 20px auto;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: "Press Start 2P", cursive;
        box-shadow: 0px 0px 10px 2px #000000;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap"
      rel="stylesheet"
    />
    <style type="text/css">
      #button {
        display: none;
      }

      .imgb_vis {
        animation: imgb-animation 7s linear;
      }

      @keyframes imgb-animation {
        10% {
          transform: translateX(0);
        }

        20% {
          transform: translateX(100px);
        }

        90% {
          transform: translateX(100px);
        }

        100% {
          transform: translateX(0);
        }
      }
    </style>
  </head>

  <body>
    <div style="width: 100vw; height: 100vh; max-width: 100%">
      <div id="game" style="display: none"></div>
      <button id="startButton">PLAY</button>
    </div>
    <script>
      document.getElementById("game").style.display = "none";
      function startGame() {
        document.getElementById("game").style.display = "block";
        document.getElementById("startButton").style.display = "none";
        EJS_player = "#game";
        EJS_core = "gba";
        EJS_color = "#000000";
        EJS_startOnLoaded = true;
        EJS_pathtodata = "https://cdn.jsdelivr.net/gh/ap-math-class/emu@master/";
        EJS_gameUrl =
          "https://cdn.jsdelivr.net/gh/ap-math-class/exams@main/gb/PokeGreen.7z";
        loadGame();
      }
      document
        .getElementById("startButton")
        .addEventListener("click", startGame);
      function loadGame() {
        var script = document.createElement("script");
        script.src =
          "https://cdn.jsdelivr.net/gh/ap-math-class/emu@master/loader.js";
        document.body.appendChild(script);
        var script = document.createElement("script");
        script.src =
          "https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/storage/js/cloak.js";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
