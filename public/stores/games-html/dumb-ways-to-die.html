<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="https://cdn.jsdelivr.net/gh/web-ports/dumb-ways-to-die@main/" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    #ruffle-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    ruffle-player, object, embed {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      ...window.RufflePlayer.config,
      publicPath: "https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/",
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "off",
      scale: "exactFit",
      forceScale: true,
      backgroundColor: "#000000"
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>
<body>
  <div id="ruffle-container"></div>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      document.getElementById("ruffle-container").appendChild(player);
      player.load("https://cdn.jsdelivr.net/gh/web-ports/dumb-ways-to-die@main/data/main.swf");
    });
  </script>
</body>
</html>
