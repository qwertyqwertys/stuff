  <title>A Small World Cup</title>

  <link rel="dns-prefetch" href="https://279362704-648691600325733615.preview.editmysite.com">
  <style>
    * {
      padding: 0;
      margin: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
      touch-action: none;
      -ms-touch-action: none;
    }
    #c2canvasdiv, canvas {
      touch-action-delay: none;
      touch-action: none;
      -ms-touch-action: none;
    }
  </style>
</head>
<body dir="ltr">
  <div id="c2canvasdiv">
    <canvas id="c2canvas" width="700" height="400"></canvas>
  </div>

  <script src="https://279362704-648691600325733615.preview.editmysite.com/uploads/b/139890129-695123685186939346/files/jquery-2.1.1.min.js"></script>
  <script src="https://279362704-648691600325733615.preview.editmysite.com/uploads/b/139890129-695123685186939346/files/c2runtime.js"></script>
  <script>
    if (window.location.protocol.slice(0, 4) === "file") {
      alert("Exported games won't work until you upload them. (When running on the file:/// protocol, browsers block many features from working for security reasons.)");
    }

    jQuery(function () {
      cr_createRuntime("c2canvas");
    });

    function onVisibilityChanged() {
      var hidden = document.hidden || document.mozHidden || document.webkitHidden || document.msHidden;
      cr_setSuspended(!!hidden);
    }

    document.addEventListener("visibilitychange", onVisibilityChanged, false);
    document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
    document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
    document.addEventListener("msvisibilitychange", onVisibilityChanged, false);

    window.C2_RegisterSW = function () {
      if (!navigator.serviceWorker) return;
      navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function (e) {
        console.warn("Failed to register service worker: ", e);
      });
    };
  </script>
</body>
</html>
