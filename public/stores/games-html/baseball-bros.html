<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Baseball Bros</title>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@ae6706e5224c55594c491edfc7f5ad541e2ea02b/baseball%20bros/">

  <link rel="manifest" href="manifest.json">

  <script>
    var aCo = 'US';

    if (typeof window.devicePixelRatio !== 'undefined' && window.devicePixelRatio > 2) {
      var meta = document.getElementById("viewport");
      if (meta) {
        meta.setAttribute('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
      }
    }

    window.addEventListener("touchmove", function(event) {
      event.preventDefault();
    }, { passive: false });

    window.addEventListener('keydown', function(e) {
      if ((e.keyCode == 32 || e.keyCode == 38 || e.keyCode == 40 || e.keyCode == 9) && e.target == document.body) {
        e.preventDefault();
      }
    });

    function ShowVideo(theUnitName = null) {
      if (typeof Main !== 'undefined' && typeof Main.DoneVideoAd === 'function') {
        Main.DoneVideoAd(true);
      }
    }

    function ShowAd1() {}
    function ShowAd2() {}
    function ShowAd3() {}
    function ShowAd4() {}
    function ShowAd6() {}
    function ShowAd7() {}
    function ShowAd8() {}
    function ShowAd9() {}
    function ShowAdBreak() {
      if (typeof Main !== 'undefined' && typeof Main.DoneInterstitialAd === 'function') {
        Main.DoneInterstitialAd(true);
      }
    }
    function SendEvent() {}
    function GamePlayStart() {
      if (typeof gCrazySDK !== 'undefined') gCrazySDK.gameplayStart();
    }
    function GamePlayStop() {
      if (typeof gCrazySDK !== 'undefined') gCrazySDK.gameplayStop();
    }
    function HappyTime() {
      if (typeof gCrazySDK !== 'undefined') gCrazySDK.happytime();
    }
  </script>
  <style>
    html, body {
      margin: 0;

      color: orange;
    }

    #game2, #openfl-content {
      width: 100%;
      height: 100%;
      background: #000000;
    }

    #loading {
      position: fixed;
      z-index: 15;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #000000;
      text-align: center;
    }
  </style>
</head>

    (function() {

      if (url.includes("www.")) {
        window.location.replace(url.replace("www.", ""));
      }
    })();
  </script>

    var gameContainer = document.getElementById('openfl-content');
    if (gameContainer) {
