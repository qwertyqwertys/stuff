<html>
<head>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background-color: #000;
  }

  #container {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  ruffle-player {
    width: 100% !important;
    height: 100% !important;
  }
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
"autoplay": "off",
"polyfills": true,
"letterbox": "off",
"backgroundColor": "#000000",
"scale": "exactFit",
"allowFullscreen": true,
"forceScale": true,
"forceAlign": true,
"splashScreen": true,
"wmode": "Window",
"unmuteOverlay": "hidden",
"quality": "high" };

window.addEventListener("load", (event) => {
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  const container = document.getElementById("container");
  container.appendChild(player);
  
  player.load("https://cdn.jsdelivr.net/gh/abdufarooq7272/Node-Binary@112f779333f99912e19cb423bf1293687a89b5cf/scripts/rpm/jup.js");
  
  // Force size properties directly on the player object after load
  player.style.width = "100vw";
  player.style.height = "100vh";
  player.style.display = "block";
});
</script>
<style type="text/css">#button {

  animation: imgb-animation 7s linear;

  20% {

  }
  90% {
    transform: translateX(100px);
  }
  100% {
