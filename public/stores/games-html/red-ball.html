<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Ball</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preload" as="fetch" href="https://cdn.jsdelivr.net/gh/SuperOreo539/Unknown@main/games/redball1/redball1.swf" crossorigin />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #flash-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #000;
      overflow: hidden;
    }
    .black-box {
      position: fixed;
      background: #000;
      z-index: 10;
      pointer-events: none;
    }
    #box-top { top: 0; left: 0; width: 100%; height: 0; }
    #box-bottom { bottom: 0; left: 0; width: 100%; height: 0; }
    #box-left { top: 0; left: 0; width: 0; height: 100%; }
    #box-right { top: 0; right: 0; width: 0; height: 100%; }
    ruffle-player {
      width: 100%;
      height: 100%;
      background: #000;
      display: block;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "auto",
      unmuteOverlay: "hidden",
      splashScreen: false,
      letterbox: "off",
      backgroundColor: "#000000"
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>
<body>
  <div id="flash-container"></div>
  <div class="black-box" id="box-top"></div>
  <div class="black-box" id="box-bottom"></div>
  <div class="black-box" id="box-left"></div>
  <div class="black-box" id="box-right"></div>

  <script>
    const container = document.getElementById("flash-container");
    const boxTop = document.getElementById("box-top");
    const boxBottom = document.getElementById("box-bottom");
    const boxLeft = document.getElementById("box-left");
    const boxRight = document.getElementById("box-right");
    const SWF_URL = "https://cdn.jsdelivr.net/gh/SuperOreo539/Unknown@main/games/redball1/redball1.swf";

    let rafId = null;

    function resizeGame() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const aspectRatio = 5.5 / 3;

      let width = Math.floor(windowWidth);
      let height = Math.floor(width / aspectRatio);

      if (height > windowHeight) {
        height = Math.floor(windowHeight);
        width = Math.floor(height * aspectRatio);
      }

      container.style.width = `${width}px`;
      container.style.height = `${height}px`;

      const topMargin = Math.max(0, (windowHeight - height) / 2);
      const leftMargin = Math.max(0, (windowWidth - width) / 2);

      boxTop.style.height = `${topMargin}px`;
      boxBottom.style.height = `${topMargin}px`;
      boxLeft.style.width = `${leftMargin}px`;
      boxRight.style.width = `${leftMargin}px`;
    }

    function scheduleResize() {
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        rafId = null;
        resizeGame();
      });
    }

    function initRuffle() {
      resizeGame();
      const ruffle = window.RufflePlayer?.newest?.() || window.RufflePlayer?.createPlayer?.();
      if (!ruffle || !container) {
        container.textContent = "Ruffle failed to load.";
        return;
      }

      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      player.style.background = "#000";
      container.replaceChildren(player);
      player.load(SWF_URL);
    }

    window.addEventListener("resize", scheduleResize, { passive: true });

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initRuffle, { once: true });
    } else {
      initRuffle();
    }
  </script>
</body>
</html>
