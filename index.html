<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/capybara.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loaded Fredoka for a playful, rounded, and friendly look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg-color: #0d1117; /* Deep matte charcoal */
      }

      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: var(--bg-color);
        color: #c9d1d9; /* Muted gray text */
        font-family: 'Fredoka', sans-serif; /* Playful, rounded font */
        overflow-y: auto; 
      }

      #root {
        width: 100%;
        min-height: 100vh;
      }

      /* === 1. CARD LAYER & SUBTLE BORDER === */
      .card, .game-card {
        background-color: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
      }

      /* === 2. SMOOTH HOVER TRANSITIONS === */
      button, .card, .game-card {
        transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      }

      .card:hover, .game-card:hover {
        background-color: #1f242c;
        border-color: #8b949e;
      }

      /* === 3. CLEAN CUSTOM SCROLLBARS === */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0d1117;
      }
      ::-webkit-scrollbar-thumb {
        background: #30363d;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #484f58;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
